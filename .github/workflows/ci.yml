name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m app.cli demo --out evidence/ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-evidence
          path: evidence/ci
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devara-eval:ci .
      - name: Check hosted startup and authentication
        run: |
          docker run -d --name eval-test -p 10000:10000 -e EVAL_PASSWORD=ci-only-password-never-use-in-production devara-eval:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:10000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:10000/api/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:10000/api/runs)" = "401"
          curl --fail --silent -u owner:ci-only-password-never-use-in-production http://localhost:10000/api/runs
      - if: always()
        run: docker logs eval-test && docker rm -f eval-test
